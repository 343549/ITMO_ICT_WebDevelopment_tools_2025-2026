name: Deploy MkDocs

on:
  push:
    branches: [main, master]
    paths:
      - "Hossein_Jafari_K3340/1lab/**"
      - ".github/workflows/mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
        working-directory: Hossein_Jafari_K3340/1lab

      - name: Build site
        run: mkdocs build
        working-directory: Hossein_Jafari_K3340/1lab

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Hossein_Jafari_K3340/1lab/site
          force_orphan: true
