name: Deploy MkDocs

on:
  push:
    branches: [main, master]
    paths:
      - "Hossein_Jafari_K3340/1lab/**"
      - ".github/workflows/mkdocs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
        working-directory: Hossein_Jafari_K3340/1lab

      - name: Build site
        run: mkdocs build
        working-directory: Hossein_Jafari_K3340/1lab

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Hossein_Jafari_K3340/1lab/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4