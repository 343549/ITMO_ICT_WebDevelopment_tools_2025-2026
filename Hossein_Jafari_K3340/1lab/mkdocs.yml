site_url: https://343549.github.io/ITMO_ICT_WebDevelopment_tools_2025-2026/
site_name: Лабораторная работа №1 — Team Finder API
site_description: Документация серверной части веб-платформы поиска команд (FastAPI)

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - Запуск: setup.md
  - Модель данных: database.md
  - API: api.md
  - Безопасность: security.md
  - Демонстрация: demo.md
  - Соответствие требованиям: compliance.md
